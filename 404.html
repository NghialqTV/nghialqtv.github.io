<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đang chuyển hướng...</title>

    <script>
        (function () {
            const NEW_SITE = "https://nghialqtv.github.io";

            // Đường dẫn mà người dùng đang truy cập
            const path = window.location.pathname;
            const query = window.location.search;
            const hash = window.location.hash;

            // Nếu là link cũ /mod/...
            if (path === "/mod" || path.indexOf("/mod/") === 0) {

                // Bỏ /mod ở đầu
                let newPath = path.substring(4);

                // Đảm bảo có /
                if (newPath === "" || newPath === "/") {
                    newPath = "/";
                }

                const newURL =
                    NEW_SITE +
                    newPath +
                    query +
                    hash;

                window.location.replace(newURL);
                return;
            }

            // Nếu không phải link /mod/ thì đưa về trang chủ
            window.location.replace(NEW_SITE + "/");

        })();
    </script>
<link rel="stylesheet" href="gaming-loader.css">
</head>

<body>
    <div style="
        text-align:center;
        margin-top:100px;
        font-family:Arial,sans-serif;
    ">
        <h2>Đang chuyển hướng...</h2>
        <p>Vui lòng chờ...</p>
    </div>
<script src="gaming-loader.js"></script>
</body>
</html>
