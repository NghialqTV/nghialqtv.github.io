@media(max-width:390px){.card{gap:10px;padding:11px}.icon{width:47px;height:47px;flex-basis:47px}.info h3{font-size:14px}.actions{min-width:82px}.action{font-size:11px;padding:9px 7px}}

<script>
/* Link nội dung và GetKey riêng cho từng mục. */
const LINKS = {
  map: "https://linkx.me/7U7wr",
  mapKey: "https://linkx.me/FN340",
  esp: "https://linkx.me/KCXrj",
  espKey: "https://linkx.me/x59iBJ"
};
function openPage(url){
  if(typeof tiktokAdGate === 'function') tiktokAdGate(url);
  else window.location.href = url;
}
function openConfigured(name){
  const url = LINKS[name];
  if(!url || url.includes('PASTE_')){
    const notice=document.getElementById('linkNotice');
    notice.style.display='block';
    notice.scrollIntoView({behavior:'smooth',block:'nearest'});
    return;
  }
  openPage(url);
}
