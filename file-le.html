<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b12">
  <title>File Mod Mới Nhất | NghĩaLQ TV</title>

  <style>
    :root {
      --bg: #080b12;
      --panel: #111725;
      --panel2: #171e2d;
      --border: #252e40;
      --lime: #baff24;
      --lime-dark: #182507;
      --text: #f4f6fb;
      --muted: #98a2b7;
    }

    * { box-sizing: border-box; }

    html { color-scheme: dark; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(ellipse at 50% 0%, #161326 0%, #090c15 48%, #070910 100%);
      font-family: Inter, "Arial", "Helvetica Neue", sans-serif;
    }

    .page-header {
      padding: 25px 18px 20px;
      border-bottom: 1px solid #202638;
      background: rgba(7, 9, 16, .92);
    }

    .header-inner,
    .toolbar,
    .file-grid {
      width: min(100%, 1050px);
      margin-inline: auto;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 25px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 2.5px;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      display: block;
      width: 34px;
      height: 4px;
      flex: 0 0 34px;
      background: var(--lime);
    }

    h1 {
      margin: 0;
      max-width: 850px;
      color: #f5f6fb;
      font-family: Impact, "Arial Black", "Helvetica Neue", sans-serif;
      font-size: clamp(32px, 7vw, 56px);
      font-weight: 1000;
      letter-spacing: -1.7px;
      line-height: .98;
      text-transform: uppercase;
    }

    .subtitle {
      margin: 13px 0 0;
      color: #929caf;
      font-size: 13px;
      font-weight: 600;
    }

    .toolbar {
      padding: 0 18px;
      margin-top: 24px;
    }

    .search-wrap {
      display: flex;
      align-items: center;
      gap: 13px;
      min-height: 64px;
      padding: 0 18px;
      border: 1px solid #2a3347;
      border-radius: 22px;
      background: #111725;
      box-shadow: 0 8px 22px #0002;
    }

    .search-icon {
      color: #8994aa;
      font-size: 25px;
      line-height: 1;
    }

    #search {
      width: 100%;
      min-width: 0;
      padding: 0;
      border: 0;
      outline: none;
      color: var(--text);
      background: transparent;
      font: inherit;
      font-size: 15px;
    }

    #search::placeholder { color: #747f95; }

    #count {
      color: var(--lime);
      font-size: 14px;
      font-weight: 1000;
      white-space: nowrap;
    }

    .file-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      padding: 0 18px 30px;
      margin-top: 24px;
    }

    .file-card {
      min-width: 0;
      overflow: hidden;
      border: 1px solid #293247;
      border-radius: 24px;
      background: linear-gradient(180deg, #141b29 0%, #101624 100%);
      box-shadow: 0 9px 24px #0002;
      transition: border-color .18s ease, transform .18s ease;
    }

    .file-card:hover {
      transform: translateY(-2px);
      border-color: #baff2480;
    }

    /* Tỷ lệ bìa 2:1 theo ảnh mẫu */
    .cover {
      position: relative;
      width: 100%;
      aspect-ratio: 2 / 1;
      overflow: hidden;
      background: #171c2b;
      isolation: isolate;
    }

    .cover-image {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    .cover::after {
      position: absolute;
      z-index: 1;
      inset: 50% 0 0;
      content: "";
      pointer-events: none;
      background: linear-gradient(180deg, transparent, rgba(7, 10, 17, .48));
    }

    .free-badge {
      position: absolute;
      z-index: 3;
      top: 10px;
      right: 10px;
      padding: 8px 10px;
      border-radius: 9px;
      color: #172006;
      background: var(--lime);
      box-shadow: 0 4px 12px #baff2418;
      font-size: 9px;
      font-weight: 900;
      white-space: nowrap;
    }

    .card-body { padding: 18px 19px 20px; }

    .item-label {
      display: none;
    }

    .file-title {
      min-height: 2.5em;
      margin: 0 0 13px;
      color: #f4f6fb;
      font-size: clamp(14px, 1.9vw, 17px);
      font-weight: 800;
      line-height: 1.3;
      text-transform: none;
      overflow-wrap: anywhere;
    }

    .card-footer {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 10px;
    }

    .file-desc {
      max-width: 62%;
      min-width: 0;
      padding: 7px 9px;
      border: 1px solid #30394d;
      border-radius: 10px;
      color: #d7deeb;
      background: #0e1420;
      font-size: 9px;
      font-weight: 800;
      line-height: 1.3;
      overflow-wrap: anywhere;
      text-transform: uppercase;
    }

    .download-btn {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-width: 82px;
      min-height: 42px;
      padding: 0 12px;
      border: 1px solid var(--lime);
      border-radius: 11px;
      color: var(--lime);
      background: transparent;
      box-shadow: none;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .2px;
      text-decoration: none;
      cursor: pointer;
      white-space: nowrap;
      transition: background .15s ease, color .15s ease;
    }

    .download-btn:hover {
      color: #172006;
      background: var(--lime);
    }

    .download-btn[aria-disabled="true"] {
      opacity: .6;
      cursor: not-allowed;
    }

    .download-arrow {
      font-size: 17px;
      line-height: .8;
    }

    .empty {
      grid-column: 1 / -1;
      padding: 38px 15px;
      border: 1px dashed #30394d;
      border-radius: 18px;
      color: var(--muted);
      text-align: center;
    }

    .back-link {
      display: block;
      width: fit-content;
      margin: 0 auto 28px;
      padding: 12px 17px;
      border: 1px solid #30394d;
      border-radius: 12px;
      color: var(--lime);
      text-decoration: none;
      font-size: 13px;
      font-weight: 800;
    }

    .back-link:hover { background: #baff2410; }

    @media (min-width: 760px) {
      .file-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .page-header { padding-top: 32px; }
    }

    @media (max-width: 390px) {
      .page-header { padding: 22px 15px 18px; }
      .toolbar { padding-inline: 14px; margin-top: 20px; }
      .file-grid { gap: 11px; padding-inline: 12px; margin-top: 20px; }
      .file-card { border-radius: 20px; }
      .card-body { padding: 13px 12px 14px; }
      .file-title { font-size: 16px; margin-bottom: 13px; }
      .item-label { font-size: 10px; }
      .free-badge { top: 8px; right: 8px; padding: 7px 8px; font-size: 8px; }
      .file-desc { max-width: 56%; padding: 7px; font-size: 8px; }
      .download-btn { min-width: 70px; min-height: 38px; padding-inline: 9px; gap: 5px; font-size: 9px; border-radius: 9px; }
      .download-arrow { font-size: 15px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }

<body>
  <header class="page-header">
    <div class="header-inner">
      <div class="eyebrow">Bộ sưu tập</div>
      <h1><span class="section-logo" aria-hidden="true">✦</span> File Mod Mới Nhất</h1>
      <p class="subtitle">File Mod Skin Lẻ · Bot Auto Mod Skin · Cập nhật mới</p>
    </div>
  </header>

  <section class="toolbar">
    <label class="search-wrap">
      <span class="search-icon" aria-hidden="true">⌕</span>
      <input id="search" type="search"
             placeholder="Tìm tên MOD, mã hoặc thể loại..."
             autocomplete="off" aria-label="Tìm file mod">
      <span id="count">0/0</span>
    </label>
  </section>

  <div class="platform-filters" role="group" aria-label="Lọc file theo nền tảng">
    <button type="button" class="platform-filter active" data-platform-filter="all" aria-pressed="true">Tất cả</button>
    <button type="button" class="platform-filter" data-platform-filter="android" aria-pressed="false">Android</button>
    <button type="button" class="platform-filter" data-platform-filter="ios" aria-pressed="false">iOS</button>
  </div>

  <main class="file-grid" id="list" aria-live="polite"></main>

  <a class="back-link" href="resources.html">← Quay lại Tài Nguyên</a>

  <div class="detail-layer" id="detail-layer" hidden>
    <section class="detail-dialog" role="dialog" aria-modal="true" aria-labelledby="detail-title">
      <div class="detail-image-wrap">
        <img class="detail-image" id="detail-image" alt="Ảnh bìa file">

      </div>
      <div class="detail-content">
        <span class="detail-category">NGHĨALQ TV · FILE MOD SKIN</span>
        <h2 class="detail-title" id="detail-title"></h2>
        <p class="detail-description" id="detail-description"></p>
        <div class="detail-downloads" id="detail-downloads"></div>
        <p class="detail-note">ⓘ Mở trang tải bên ngoài. Làm theo hướng dẫn trên trang để tải file.</p>
      </div>
    </section>
  </div>

  <script>
    /*
      Dữ liệu vẫn đọc từ data/file-le.json.
      Có lựa chọn Android/iOS cho từng file và bộ lọc nền tảng.
      Một ảnh chung (image) cho cả Android / iOS và hai link tải riêng.
      Trường link chung dùng dự phòng cho file cũ.
      Link lỗi sẽ tự chuyển sang ảnh SVG dự phòng.
    */
    let data = [];

    const list = document.getElementById("list");
    const searchInput = document.getElementById("search");
    const count = document.getElementById("count");
    const platformFilters = Array.from(document.querySelectorAll('[data-platform-filter]'));
    let selectedPlatform = 'all';
    const layer = document.getElementById('detail-layer');
    const detailImage = document.getElementById('detail-image');
    const detailTitle = document.getElementById('detail-title');
    const detailDesc = document.getElementById('detail-description');
    const detailDownloads = document.getElementById('detail-downloads');
    const closeBtn = document.getElementById('detail-close');
    let lastFocusedElement = null;
    function closeDetail() {
      layer.hidden = true;
      document.body.classList.remove('modal-open');
      if (lastFocusedElement) lastFocusedElement.focus();
    }
    closeBtn.addEventListener('click', closeDetail);
    layer.addEventListener('click', e => { if (e.target === layer) closeDetail(); });
    document.addEventListener('keydown', e => {
      if (layer.hidden) return;
      if (e.key === 'Escape') closeDetail();
      if (e.key === 'Tab') {
        const focusable = Array.from(layer.querySelectorAll('button:not(:disabled)'));
        if (!focusable.length) return;
        const first = focusable[0], last = focusable[focusable.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    });
    function openDetail(item) {
      lastFocusedElement = document.activeElement;
      const image = getCoverLink(item);
      const fallback = makeCover(item);
      detailImage.onerror = () => { if (detailImage.src !== fallback) detailImage.src = fallback; };
      detailImage.src = image || fallback;
      detailImage.alt = 'Ảnh bìa chung ' + (item.name || 'File Mod');
      detailTitle.textContent = item.name || 'File Mod';
      detailDesc.textContent = item.desc || 'File mod tải miễn phí cho nền tảng tương ứng.';
      detailDownloads.replaceChildren();
      const platforms = getPlatforms(item);
      (platforms.length ? platforms : ['']).forEach(platform => {
        const link = getDownloadLink(item, platform);
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'detail-download-btn';
        button.textContent = platform === 'android' ? '↓  Tải cho Android  →' : platform === 'ios' ? '↓  Tải cho iOS  →' : '↓  Tải file  →';
        if (!link || link === '#') { button.disabled = true; button.title='Chưa có link tải'; }
        button.addEventListener('click', () => downloadFile(link));
        detailDownloads.append(button);
      });
      layer.hidden = false;
      document.body.classList.add('modal-open');
      closeBtn.focus();
    }

    // Platforms are explicit per file. Older data with no field stays compatible.
    function getPlatforms(item) {
      // Link tải riêng trong data/file-le.json tự bật nút Android/iOS tương ứng.
      const result = Array.isArray(item.platforms)
        ? item.platforms.filter(v => v === 'android' || v === 'ios')
        : [];
      if (String(item.linkAndroid || '').trim() && !result.includes('android')) result.push('android');
      if (String(item.linkIos || '').trim() && !result.includes('ios')) result.push('ios');
      if (result.length) return ['android', 'ios'].filter(v => result.includes(v));
      if (Array.isArray(item.platforms)) return [];
      const desc = String(item.desc || '').toLowerCase();
      return ['android', 'ios'].filter(v => new RegExp('\\b' + v + '\\b').test(desc));
    }
    function getCoverLink(item) {
      // Ưu tiên một ảnh chung. Dữ liệu cũ có imageAndroid/imageIos vẫn xem được.
      const candidate = item.image || item.imageAndroid || item.imageIos || '';
      return isCustomCover(candidate) ? candidate.trim() : '';
    }
    function getDownloadLink(item, platform) {
      const specific = platform === 'android' ? item.linkAndroid : platform === 'ios' ? item.linkIos : '';
      return String(specific || item.link || '').trim();
    }
    function downloadFile(url) {
      if (!url || url === '#') { alert('File này chưa có link tải!'); return; }
      if (typeof tiktokAdGate === 'function') tiktokAdGate(url);
      else window.open(url, '_blank', 'noopener');
    }
    platformFilters.forEach(btn => btn.addEventListener('click', () => {
      selectedPlatform = btn.dataset.platformFilter;
      platformFilters.forEach(other => {
        const active = other === btn;
        other.classList.toggle('active', active);
        other.setAttribute('aria-pressed', String(active));
      });
      renderList();
    }));

    function escapeSvg(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&apos;");
    }

    function wrapTitle(name, maxChars = 22, maxLines = 3) {
      const words = String(name || "MOD SKIN")
        .toLocaleUpperCase("vi")
        .trim()
        .split(/\s+/);
      const lines = [];
      let line = "";

      for (const word of words) {
        const candidate = line ? line + " " + word : word;
        if (candidate.length > maxChars && line) {
          lines.push(line);
          line = word;
        } else {
          line = candidate;
        }
      }

      if (line) lines.push(line);
      if (lines.length > maxLines) {
        lines.length = maxLines;
        lines[maxLines - 1] = lines[maxLines - 1].slice(0, maxChars - 3) + "...";
      }
      return lines;
    }

    function makeCover(item, index) {
      const name = String(item.name || "MOD SKIN");
      let hash = 0;
      for (let i = 0; i < name.length; i++) {
        hash = (hash * 31 + name.charCodeAt(i)) >>> 0;
      }

      const hue = hash % 360;
      const hue2 = (hue + 65 + (hash % 70)) % 360;
      const lines = wrapTitle(name);
      const titleSvg = lines.map((line, lineIndex) =>
        `<text x="38" y="${145 + lineIndex * 39}"
          font-family="Arial, sans-serif" font-size="30"
          font-weight="900" fill="#fff">${escapeSvg(line)}</text>`
      ).join("");

      const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360">
          <defs>
            <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#080b16"/>
              <stop offset=".52" stop-color="hsl(${hue} 65% 25%)"/>
              <stop offset="1" stop-color="hsl(${hue2} 70% 12%)"/>
            </linearGradient>
            <radialGradient id="glow">
              <stop offset="0" stop-color="hsl(${hue2} 100% 68%)" stop-opacity=".8"/>
              <stop offset="1" stop-color="hsl(${hue2} 100% 68%)" stop-opacity="0"/>
            </radialGradient>
            <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
              <path d="M28 0H0V28" fill="none" stroke="#fff" stroke-opacity=".08"/>
            </pattern>
          </defs>
          <rect width="720" height="360" fill="url(#bg)"/>
          <rect width="720" height="360" fill="url(#grid)"/>
          <circle cx="570" cy="125" r="190" fill="url(#glow)" opacity=".72"/>
          <path d="M430 360 720 70V360Z" fill="hsl(${hue2} 95% 60%)" opacity=".15"/>
          <path d="M0 290 290 0H385L95 360H0Z" fill="#fff" opacity=".035"/>
          <rect x="22" y="22" width="676" height="316" rx="20" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="2"/>
          <rect x="34" y="34" width="142" height="30" rx="8" fill="#baff24"/>
          <text x="105" y="54" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="900" fill="#172006">NGHĨALQ TV</text>
          <text x="680" y="55" text-anchor="end" font-family="Arial,sans-serif" font-size="16" font-weight="800" fill="#fff">MOD SKIN</text>
          <g transform="translate(525 102)" opacity=".85">
            <circle cx="68" cy="68" r="66" fill="none" stroke="#fff" stroke-opacity=".34" stroke-width="2"/>
            <circle cx="68" cy="68" r="47" fill="none" stroke="#baff24" stroke-width="3"/>
            <path d="M68 15 80 56 121 68 80 80 68 121 56 80 15 68 56 56Z" fill="#fff" opacity=".88"/>
          </g>
          ${titleSvg}
          <rect x="38" y="273" width="180" height="5" rx="2.5" fill="#baff24"/>
          <text x="38" y="307" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#e7ffb8" letter-spacing="3">MOD RESOURCE • FREE</text>
        </svg>`;
      return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
    }

    // Hỗ trợ dán URL ảnh trực tiếp; vẫn nhận đường dẫn assets/ cũ.
    function isCustomCover(path) {
      if (typeof path !== 'string' || !path.trim()) return false;
      const value = path.trim();
      if (/^https?:\/\//i.test(value)) return true;
      return /^(?:\.\/)?assets\/[^<>"\x27`\\?#]+$/iu.test(value) && !value.includes('..');
    }

    function renderList() {
      const query = searchInput.value.trim().toLocaleLowerCase("vi");
      const filtered = data
        .map((item, originalIndex) => ({ item, originalIndex }))
        .filter(({ item, originalIndex }) => {
          const searchable = `${item.name || ""} ${item.desc || ""} ${item.link || ""} ${originalIndex + 1}`
            .toLocaleLowerCase("vi");
          return searchable.includes(query) &&
            (selectedPlatform === 'all' || getPlatforms(item).includes(selectedPlatform));
        });

      list.replaceChildren();
      count.textContent = `${filtered.length}/${data.length}`;

      if (!filtered.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "Không tìm thấy file phù hợp. Hãy thử từ khóa khác nhé.";
        list.appendChild(empty);
        return;
      }

      filtered.forEach(({ item, originalIndex }) => {
        const card = document.createElement("article");
        card.className = "file-card";
        const platforms = getPlatforms(item);
        const number = String(originalIndex + 1).padStart(3, "0");

        card.innerHTML = `
          <div class="cover">
            <img class="cover-image" alt="" loading="lazy">
            <span class="free-badge">MIỄN PHÍ</span>
          </div>
          <div class="card-body">
            <h2 class="file-title"></h2>
            <div class="platform-chips" aria-label="Nền tảng hỗ trợ"></div>
            <div class="card-footer">
              <span class="file-desc"></span>
              <button class="detail-btn" type="button">Chi tiết ❯</button>
            </div>
          </div>
        `;

        const cover = card.querySelector('.cover-image');
        const fallback = makeCover(item, originalIndex);
        const image = getCoverLink(item);
        cover.addEventListener('error', () => { if (cover.src !== fallback) cover.src = fallback; });
        cover.alt = 'Ảnh bìa chung ' + (item.name || 'File Mod');
        cover.src = image || fallback;
        card.querySelector('.file-title').textContent = item.name || 'File Mod';
        const chips = card.querySelector('.platform-chips');
        platforms.forEach(platform => {
          const chip = document.createElement('span');
          chip.className = 'platform-chip ' + platform;
          chip.textContent = platform === 'android' ? 'Android' : 'iOS';
          chips.append(chip);
        });
        if (!platforms.length) chips.hidden = true;
        const detailBtn = card.querySelector('.detail-btn');
        detailBtn.addEventListener('click', () => openDetail(item));
        cover.parentElement.addEventListener('click', () => openDetail(item));
        cover.parentElement.style.cursor = 'pointer';
        // Do not incorrectly label unclassified files as Android/iOS.
        const description = String(item.desc || '');
        const descOnlyPlatform = /^(?:android|ios|iphone|ipad)(?:\s*[-/|,&+]\s*(?:android|ios|iphone|ipad))*$/i.test(description.trim());
        const desc = card.querySelector('.file-desc');
        desc.textContent = descOnlyPlatform ? '' : description;
        if (!desc.textContent) desc.hidden = true;

        list.appendChild(card);
      });
    }

    searchInput.addEventListener("input", renderList);

    fetch("data/file-le.json?v=" + Date.now(), { cache: "no-store" })
      .then((response) => {
        if (!response.ok) throw new Error("HTTP " + response.status);
        return response.json();
      })
      .then((items) => {
        if (!Array.isArray(items)) throw new Error("Dữ liệu JSON không hợp lệ");
        data = items;
        renderList();
      })
      .catch((error) => {
        console.error("Không tải được data/file-le.json:", error);
        list.innerHTML = '<div class="empty">Không tải được dữ liệu file. Hãy kiểm tra data/file-le.json.</div>';
        count.textContent = "0/0";
      });
  </script>

</body>
</html>
