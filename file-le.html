<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>File Lẻ | NghĩaLQ TV</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --bg: #080b16;
      --panel: #111625;
      --panel2: #151b2b;
      --border: #293145;
      --primary: #ff4fa3;
      --primary2: #ff82bd;
      --text: #f5f6fb;
      --sub: #9aa3b8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: radial-gradient(ellipse at top, #171125 0%, #090c17 48%, #070914 100%);
      min-height: 100vh;
    }
    header {
      padding: 28px 18px 24px;
      border-bottom: 1px solid #24283a;
      background: rgba(7, 9, 20, .92);
      text-align: left;
    }
    .head-inner { max-width: 1050px; margin: auto; }
    .eyebrow {
      display: flex; align-items: center; gap: 10px;
      color: var(--primary2); font-size: 12px; font-weight: 800;
      letter-spacing: 2px; text-transform: uppercase; margin-bottom: 12px;
    }
    .eyebrow::before { content: ""; width: 34px; height: 4px; background: var(--primary); border-radius: 8px; }
    header h1 { margin: 0; font-size: clamp(28px, 5vw, 46px); line-height: 1.05; font-weight: 900; letter-spacing: -1.5px; }
    header p { margin: 12px 0 0; color: var(--sub); font-size: 14px; }
    .toolbar { max-width: 1050px; margin: 22px auto 0; padding: 0 18px; }
    .search-wrap {
      display: flex; align-items: center; gap: 12px;
      background: #121727; border: 1px solid #30374b; border-radius: 18px;
      padding: 0 17px; min-height: 62px; box-shadow: 0 8px 24px #0002;
    }
    .search-icon { color: var(--sub); font-size: 23px; }
    #search { width: 100%; min-width: 0; background: transparent; border: 0; outline: 0; color: var(--text); font: inherit; font-size: 15px; }
    #search::placeholder { color: #7f879b; }
    #count { color: var(--primary2); font-weight: 800; font-size: 13px; white-space: nowrap; }
    .container {
      max-width: 1050px; margin: 0 auto; padding: 24px 18px 30px;
      display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px;
    }
    .card {
      min-width: 0; position: relative; overflow: hidden; border-radius: 23px;
      border: 1px solid #30374b; background: linear-gradient(180deg, #151a2a, #101523 70%);
      box-shadow: 0 10px 26px #0002; transition: transform .2s, border-color .2s;
    }
    .card:hover { transform: translateY(-3px); border-color: #ff4fa38a; }
    .cover {
      height: 165px; position: relative; overflow: hidden; display: flex;
      align-items: center; justify-content: center;
      background: linear-gradient(135deg, #482043, #17213d 55%, #24132d);
    }
    .cover::before, .cover::after { display:none; }
    .cover::before { width: 220px; height: 220px; right: -35px; top: -105px; background: radial-gradient(circle, #ff82bd80, transparent 68%); }
    .cover::after { width: 180px; height: 180px; left: -65px; bottom: -115px; background: radial-gradient(circle, #a855f780, transparent 70%); }
    .cover-image { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:1; }
    .free { position:absolute; z-index:3; top:12px; right:12px; padding:8px 11px; border-radius:10px; color:#250a19; background:var(--primary); font-size:10px; font-weight:900; }
    .card-body { padding: 15px 16px 17px; }
    .title { font-size: 17px; line-height: 1.3; font-weight: 800; margin-bottom: 13px; overflow-wrap: anywhere; }
    .bottom { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .desc { color:#ffd2e7; border:1px solid #74405d; border-radius:10px; padding:7px 9px; font-size:10px; font-weight:800; text-transform:uppercase; }
    .download { display: inline-flex; align-items: center; justify-content: center; gap: 9px; min-height: 48px; padding: 0 17px; border-radius: 13px; background: var(--primary); color: #210b19; font-weight: 900; font-size: 12px; text-decoration: none; border: 0; cursor: pointer; box-shadow: 0 5px 18px #ff4fa326; white-space: nowrap; }
    .download:hover { background: #ff83bd; }
    .empty { grid-column: 1 / -1; text-align: center; padding: 42px 12px; color: var(--sub); border: 1px dashed #343b4e; border-radius: 18px; }
    .back { display: block; text-align: center; margin: 0 auto 28px; width: fit-content; padding: 11px 17px; border-radius: 12px; border: 1px solid #343b4e; color: var(--primary2); text-decoration: none; }
    .back:hover { background: #ff4fa314; }
    @media (min-width: 760px) { .container { grid-template-columns: repeat(3, minmax(0, 1fr)); } .cover { height: 185px; } }
    @media (max-width: 380px) { .container { gap: 10px; padding-left: 10px; padding-right: 10px; } .card-body { padding: 12px; } .title { font-size: 15px; } .cover { height: 130px; } .download { padding: 0 11px; } }
  </style>
<script src="tiktok_ads/config.js"></script>
<script src="tiktok_ads/tiktok-gate.js"></script>
</head>

<body>

<header>
  <div class="head-inner">
    <div class="eyebrow">Bộ sưu tập</div>
    <h1>FILE MOD MỚI NHẤT</h1>
    <p>File Mod Skin Lẻ · Bot Auto Mod Skin · Cập nhật mới</p>
  </div>
</header>

<section class="toolbar">
  <label class="search-wrap">
    <span class="search-icon">⌕</span>
    <input id="search" type="search" placeholder="Tìm tên MOD, mã hoặc thể loại..." autocomplete="off">
    <span id="count">0/0</span>
  </label>
  </section>
<div class="container" id="list"></div>

<a class="back" href="resources.html">⬅ Quay lại Tài Nguyên</a>

<script>
/* ========= DATA FILE LẺ: đọc từ data/file-le.json ========= */
let data = [];

/* ========= RENDER + SEARCH ========= */
const list = document.getElementById("list");
const searchInput = document.getElementById("search");
const count = document.getElementById("count");
let activeFilter = "all";

function renderList() {
  const query = searchInput.value.trim().toLocaleLowerCase("vi");
  const filtered = data.filter((item, index) => {
    const text = `${item.name} ${item.desc} ${item.link} ${index + 1}`.toLocaleLowerCase("vi");
    return text.includes(query);
  });
  list.innerHTML = "";
  count.textContent = `${filtered.length}/${data.length}`;
  if (!filtered.length) {
    list.innerHTML = '<div class="empty">Không tìm thấy file phù hợp. Hãy thử từ khóa khác nhé.</div>';
    return;
  }
  filtered.forEach((item, index) => {
    const div = document.createElement("article");
    div.className = "card";
    const icon = item.icon || "🎮";
    const unavailable = !item.link || item.link === "#";
    div.innerHTML = `
      <div class="cover">
        <span class="free">MIỄN PHÍ</span>
        <img class="cover-image" src="${item.image || ""}" alt="" loading="lazy" onerror="this.style.display='none'">
      </div>
      <div class="card-body">
        <div class="title"></div>
        <div class="bottom">
          <span class="desc"></span>
          <a class="download" href="${unavailable ? "#" : item.link}" ${unavailable ? 'aria-disabled="true"' : 'target="_blank" rel="noopener noreferrer"'}>TẢI <span aria-hidden="true">↓</span></a>
        </div>
      </div>`;
    div.querySelector(".title").textContent = item.name.trim();
    div.querySelector(".desc").textContent = item.desc || "File mod skin";
    const button = div.querySelector(".download");
    button.addEventListener("click", event => {
      if (unavailable) {
        event.preventDefault();
        alert("File này chưa có link tải!");
      } else {
        event.preventDefault();
        if (typeof tiktokAdGate === "function") tiktokAdGate(item.link);
        else window.open(item.link, "_blank", "noopener");
      }
    });
    list.appendChild(div);
  });
}
searchInput.addEventListener("input", renderList);
document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    activeFilter = tab.dataset.filter;
    renderList();
  });
});
fetch('data/file-le.json', { cache: 'no-cache' })
  .then(response => { if (!response.ok) throw new Error('HTTP ' + response.status); return response.json(); })
  .then(items => { if (!Array.isArray(items)) throw new Error('Dữ liệu JSON không hợp lệ'); data = items; renderList(); })
  .catch(error => { console.error(error); list.innerHTML = '<div class="empty">Không tải được dữ liệu file. Hãy kiểm tra data/file-le.json.</div>'; count.textContent = '0/0'; });
</script>

</body>
</html>
