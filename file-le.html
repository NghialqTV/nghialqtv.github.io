    :root {
      --bg: #0b1220;

      --sub: #9ca3af;

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont;
      background: linear-gradient(180deg, #020617, #0b1220);
      color: var(--text);
    }

    header {
      padding: 22px 16px;
      text-align: center;
      border-bottom: 1px solid var(--border);
      background: rgba(2,6,23,0.9);
      backdrop-filter: blur(6px);
    }

    header h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
    }

    header p {
      margin-top: 6px;
      font-size: 13px;
      color: var(--sub);
    }

    .container {
      padding: 16px;
      max-width: 900px;
      margin: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 14px;
    }

    .card {
      background: linear-gradient(180deg, #0f172a, #020617);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      cursor: pointer;
      transition: 0.25s ease;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top left, rgba(56,189,248,0.15), transparent 60%);
      opacity: 0;
      transition: 0.3s;
    }

    .card:hover::before {
      opacity: 1;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--primary);
    }

    .icon {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: #020617;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
    }

    .title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .desc {
      font-size: 12px;
      color: var(--sub);
      line-height: 1.4;
    }

    .back {
      display: block;
      text-align: center;
      margin: 28px auto 20px;
      width: fit-content;
      padding: 10px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      color: var(--primary);
      text-decoration: none;
      transition: 0.2s;
    }

    .back:hover {
      background: rgba(56,189,248,0.1);
    }
