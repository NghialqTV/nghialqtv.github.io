<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mod Pack | NghĩaLQ TV</title>
<script src="tiktok_ads/config.js"></script><script src="tiktok_ads/tiktok-gate.js"></script>
<style>
:root{--bg:#050b18;--panel:#0b1427;--panel2:#101c32;--line:#223452;--text:#f4f7ff;--sub:#91a0ba;--pink:#ff2d86;--cyan:#22c7ff;--purple:#9b5cff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#16284b 0,#050b18 48%,#030711 100%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
.top{max-width:1120px;margin:auto;padding:18px 16px 8px;display:flex;align-items:center;gap:14px}.back{width:42px;height:42px;border-radius:13px;border:1px solid var(--line);background:#0d192d;color:#fff;text-decoration:none;display:grid;place-items:center;font-size:25px}.brand{font-size:22px;font-weight:850}.brand small{display:block;color:var(--sub);font-size:12px;font-weight:500;margin-top:2px}
.wrap{max-width:1120px;margin:auto;padding:8px 16px 36px}.hero{text-align:center;padding:14px 0 20px}.hero h1{margin:0;font-size:28px}.hero h1 span{color:var(--pink)}.hero p{margin:7px 0 0;color:var(--sub);font-size:13px}
.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 18px}.filter{border:1px solid var(--line);background:#0c172b;color:#aebbd0;padding:12px;border-radius:13px;text-align:center;font-weight:750;cursor:pointer}.filter.active{background:linear-gradient(135deg,#ff2d86,#8b32ff);color:#fff;border-color:#ff54a0;box-shadow:0 0 20px #ff2d8638}
.layout{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(320px,.92fr);gap:16px}.list{display:flex;flex-direction:column;gap:12px}.card{display:grid;grid-template-columns:180px 1fr;gap:14px;padding:10px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,#0e1a2e,#081121);box-shadow:0 12px 28px #0004;cursor:pointer;transition:.2s}.card:hover,.card.active{border-color:#ff3d92;box-shadow:0 0 24px #ff2d8620}.thumb{width:100%;height:105px;object-fit:cover;border-radius:12px;border:1px solid #30415f}.ct{min-width:0;padding:3px 3px}.ct h2{font-size:17px;margin:0 0 7px}.desc{color:var(--sub);font-size:12px;line-height:1.45}.badges{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.badge{font-size:10px;padding:5px 8px;border-radius:999px;background:#13233d;color:#b9c8de;border:1px solid #263a5b}.download{display:inline-flex;margin-top:10px;padding:8px 13px;border-radius:10px;background:linear-gradient(135deg,#ff267f,#ff4d5e);color:#fff;text-decoration:none;font-size:12px;font-weight:850}
.detail{position:sticky;top:12px;align-self:start;border:1px solid #263858;border-radius:20px;background:linear-gradient(145deg,#0d172a,#07101f);padding:12px;box-shadow:0 18px 45px #0006}.detail-head{display:flex;align-items:center;gap:9px;padding:5px 4px 12px;border-bottom:1px solid #1d2c46;font-weight:850}.detail-head span{color:var(--pink)}.detail-img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:14px;margin-top:12px;border:1px solid #334766}.detail h2{font-size:22px;margin:13px 2px 5px}.detail-sub{color:var(--sub);font-size:13px}.specs{margin-top:14px;border:1px solid #1c2b45;border-radius:14px;overflow:hidden}.spec{display:flex;justify-content:space-between;gap:12px;padding:12px;border-bottom:1px solid #1c2b45;font-size:12px}.spec:last-child{border-bottom:0}.spec b{color:#aebbd0}.spec strong{color:#ff64ad}.detail-download{display:block;text-align:center;margin-top:14px;padding:13px;border-radius:12px;background:linear-gradient(135deg,#ff2d86,#ff405e);color:#fff;text-decoration:none;font-weight:850}.gallery-title{margin:18px 2px 9px;font-size:13px;font-weight:800}.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.gallery img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:9px;border:1px solid #283b5d}
.ad-modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:20px;background:#000b;backdrop-filter:blur(8px);z-index:999}.ad-modal.show{display:flex}.ad-box{width:min(390px,100%);padding:23px;border-radius:20px;background:#0b1427;border:1px solid #ff2d8660;text-align:center}.ad-box h3{margin:0 0 7px}.ad-box p{color:var(--sub);font-size:13px}.bar{height:6px;background:#18243a;border-radius:9px;overflow:hidden;margin:17px 0}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff2d86,#8b5cff)}.continue{display:none;width:100%;padding:12px;border:0;border-radius:11px;background:#ff2d86;color:#fff;font-weight:850}.continue.show{display:block}
@media(max-width:760px){.layout{grid-template-columns:1fr}.detail{position:relative;top:0}.card{grid-template-columns:135px 1fr}.thumb{height:88px}.hero h1{font-size:25px}}
@media(max-width:470px){.card{grid-template-columns:115px 1fr}.thumb{height:78px}.ct h2{font-size:15px}.download{padding:7px 10px}.detail h2{font-size:20px}}
</style></head><body>
<div class="top"><a class="back" href="index.html" aria-label="Quay lại">‹</a><div class="brand"><span style="color:#ff2d86">▰</span> Mod Pack<small>Tổng hợp các pack mod skin chất lượng cao</small></div></div>
<main class="wrap"><section class="hero"><h1><span>▰</span> Mod Pack</h1><p>Android - IOS • Full nút bấm • Không trùng • S4 - 2026</p></section>
<div class="filters"><button class="filter active" data-filter="all">Tất Cả</button><button class="filter" data-filter="android">Android</button><button class="filter" data-filter="ios">IOS</button></div>
<div class="layout"><section class="list" id="list"></section><aside class="detail" id="detail"></aside></div></main>
<div class="ad-modal" id="adModal"><div class="ad-box"><div style="font-size:28px">📢</div><h3>Đang mở quảng cáo</h3><p>Vui lòng chờ một chút trước khi tải Mod Pack.</p><div class="bar"><i id="progress"></i></div><div id="count" style="font-size:12px;color:#ff79b5">Đang chuẩn bị…</div><button class="continue" id="continue">Tiếp tục tải</button></div></div>
<script>
let packs=[], selected=0, filter='all';

const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const platformSet=p=>String(p.tag||'').toLowerCase();
function supports(p,f){
  if(f==='all') return true;
  return platformSet(p,f);
}
function skinCount(name){
  const m=String(name||'').match(/\d+/);
  return m ? m[0] : '—';
}
function featureText(p){
  const t=String(p.tag||'').toUpperCase();
  return t==='ANDROID' ? 'Full Nút Bấm • Không Trùng' : 'Android - IOS • Full Nút Bấm';
}
function bindDownloadButtons(){
  document.querySelectorAll('.modpack-download').forEach(a=>{
    a.onclick=e=>{
      e.preventDefault();
      const dest=a.dataset.link;
      if(!dest) return;
      const modal=document.getElementById('adModal');
      const progress=document.getElementById('progress');
      const count=document.getElementById('count');
      const go=document.getElementById('continue');
      modal.classList.add('show');
      go.classList.remove('show');
      progress.style.width='0%';
      let elapsed=0;
      const total=2500;
      const timer=setInterval(()=>{
        elapsed+=100;
        const pct=Math.min(100,elapsed/total*100);
        progress.style.width=pct+'%';
        const left=Math.max(0,Math.ceil((total-elapsed)/1000));
        count.textContent=pct<100 ? `Vui lòng chờ ${left} giây…` : 'Bạn có thể tiếp tục tải.';
        if(pct>=100){
          clearInterval(timer);
          go.classList.add('show');
        }
      },100);
      go.onclick=()=>{ modal.classList.remove('show'); window.location.href=dest; };
    };
  });
}
function renderList(){
  const visible=packs.filter(p=>supports(p,filter));
  const box=document.getElementById('list');
  box.innerHTML=visible.length ? visible.map(p=>{
    const i=packs.indexOf(p);
    const platforms=platformSet(p).includes('android') && platformSet(p).includes('ios')
      ? '<span class="badge">🤖 Android</span><span class="badge"> IOS</span>'
      : platformSet(p).includes('android') ? '<span class="badge">🤖 Android</span>' : '<span class="badge"> IOS</span>';
    return `<article class="card ${i===selected?'active':''}" data-i="${i}">
      <img class="thumb" src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy">
      <div class="ct">
        <h2>${esc(p.name)} ${i===0?'🔥':''}</h2>
        <div class="desc">${esc(featureText(p))}<br>S4 - 2026</div>
        <div class="badges">${platforms}</div>
        <a class="download modpack-download" data-link="${esc(p.link)}" href="${esc(p.link)}">⇩ Tải Ngay</a>
      </div>
    </article>`;
  }).join('') : '<div class="desc">Không có pack cho nền tảng này.</div>';

  document.querySelectorAll('.card').forEach(c=>c.addEventListener('click',e=>{
    if(e.target.closest('.download')) return;
    selected=Number(c.dataset.i);
    renderList();
    renderDetail();
  }));
  bindDownloadButtons();
}
function renderDetail(){
  const p=packs[selected]||packs[0];
  if(!p) return;
  const gallery=packs.slice(0,4).map(x=>x.image);
  document.getElementById('detail').innerHTML=`
    <div class="detail-head"><span>▰</span> Chi Tiết Mod Pack</div>
    <img class="detail-img" src="${esc(p.image)}" alt="${esc(p.name)}">
    <h2>${esc(p.name)} ${selected===0?'🔥':''}</h2>
    <div class="detail-sub">${esc(featureText(p))} • S4 - 2026</div>
    <div class="specs">
      <div class="spec"><b>▱ Số Skin</b><strong>${esc(skinCount(p.name))} Skin</strong></div>
      <div class="spec"><b>🎮 Tính Năng</b><span>${esc(featureText(p))}</span></div>
      <div class="spec"><b>▦ Cập Nhật</b><strong>S4 - 2026</strong></div>
      <div class="spec"><b>▰ Dung Lượng</b><span>Tuỳ theo pack</span></div>
    </div>
    <a class="detail-download modpack-download" data-link="${esc(p.link)}" href="${esc(p.link)}">⇩ Tải Ngay ↗</a>
    <div class="gallery-title">⊞ Hình Ảnh Pack</div>
    <div class="gallery">${gallery.map(x=>`<img src="${esc(x)}" alt="Hình ảnh pack" loading="lazy">`).join('')}</div>`;
  bindDownloadButtons();
}
async function init(){
  const r=await fetch('data/modpacks.json?v='+Date.now(),{cache:'no-store'});
  if(!r.ok) throw new Error('Không tải được data/modpacks.json');
  packs=await r.json();
  if(!Array.isArray(packs)||!packs.length) throw new Error('Danh sách Mod Pack trống');
  renderList();
  renderDetail();
}
document.querySelectorAll('.filter').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  filter=b.dataset.filter;
  renderList();
}));
init().catch(err=>{
  console.error(err);
  document.getElementById('list').innerHTML='<div class="desc">Không tải được Mod Pack. Hãy kiểm tra data/modpacks.json.</div>';
});
</script></body>
