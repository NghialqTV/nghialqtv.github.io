<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mod Pack | NghĩaLQ TV</title>
  <script src="tiktok_ads/config.js"></script>
  <script src="tiktok_ads/tiktok-gate.js"></script>
  <style>
    .ad-notice{max-width:900px;margin:14px auto 0;padding:0 16px}
    .ad-notice-inner{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid rgba(56,189,248,.18);border-radius:15px;background:linear-gradient(145deg,rgba(15,23,42,.92),rgba(10,20,38,.9));color:#cbd5e1;font-size:12px}
    .ad-dot{width:9px;height:9px;border-radius:50%;background:#38bdf8;box-shadow:0 0 12px rgba(56,189,248,.7);flex:0 0 auto}
    .ad-label{font-weight:800;color:#7dd3fc;margin-right:4px}
    .ad-modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.68);backdrop-filter:blur(8px);z-index:9999}
    .ad-modal.show{display:flex}
    .ad-box{width:min(390px,100%);padding:24px 20px;border:1px solid rgba(56,189,248,.28);border-radius:22px;background:linear-gradient(145deg,#111c30,#07101f);box-shadow:0 25px 70px rgba(0,0,0,.55),0 0 30px rgba(56,189,248,.08);text-align:center}
    .ad-icon{width:58px;height:58px;margin:0 auto 12px;border-radius:17px;display:grid;place-items:center;background:rgba(56,189,248,.12);border:1px solid rgba(56,189,248,.25);font-size:27px}
    .ad-box h2{margin:0 0 7px;font-size:20px}
    .ad-box p{margin:0;color:var(--sub);font-size:13px;line-height:1.5}
    .ad-progress{height:6px;margin:18px 0 12px;border-radius:99px;overflow:hidden;background:#18243a}
    .ad-progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,#38bdf8,#8b5cf6);transition:width .1s linear}
    .ad-count{font-size:12px;color:#7dd3fc;font-weight:750}
    .ad-continue{display:none;margin-top:15px;width:100%;padding:12px;border:0;border-radius:13px;background:linear-gradient(145deg,#38bdf8,#1677e8);color:#fff;font-weight:850;font-size:14px}
    .ad-continue.show{display:block}
    :root{--bg:#020617;--card:#0f172a;--card2:#111c30;--border:#24324a;--primary:#38bdf8;--text:#e8eef8;--sub:#98a6ba}
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(180deg,#020617,#0b1220);color:var(--text);min-height:100vh}
    header{padding:24px 16px 20px;text-align:center;border-bottom:1px solid rgba(148,163,184,.12);background:rgba(2,6,23,.88);backdrop-filter:blur(8px)}
    header h1{margin:0;font-size:25px;font-weight:850;letter-spacing:.3px}
    header p{margin:7px 0 0;font-size:13px;color:var(--sub)}
    .container{max-width:900px;margin:0 auto;padding:18px 16px 32px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
    .pack-card{position:relative;overflow:hidden;border:1px solid var(--border);border-radius:20px;background:linear-gradient(145deg,var(--card2),var(--card));box-shadow:0 12px 28px rgba(0,0,0,.22);transition:.2s ease}
    .pack-card:hover{transform:translateY(-3px);border-color:rgba(56,189,248,.55);box-shadow:0 16px 32px rgba(0,0,0,.28),0 0 20px rgba(56,189,248,.08)}
    .pack-image{width:100%;height:145px;object-fit:cover;display:block;background:#020617}
    .pack-body{padding:15px}
    .pack-title{font-size:17px;font-weight:800;margin:0 0 6px}
    .pack-desc{font-size:13px;color:var(--sub);line-height:1.45;min-height:38px}
    .pack-tag{display:inline-block;margin-top:10px;padding:5px 9px;border-radius:999px;background:rgba(56,189,248,.1);border:1px solid rgba(56,189,248,.2);color:#7dd3fc;font-size:11px;font-weight:750}
    .pack-link{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:13px;padding:11px 13px;border-radius:13px;background:linear-gradient(145deg,#38bdf8,#1677e8);color:white;text-decoration:none;font-weight:800;box-shadow:0 8px 18px rgba(37,99,235,.24)}
    .back{display:block;width:max-content;margin:0 auto 26px;padding:10px 16px;border:1px solid var(--border);border-radius:12px;color:#7dd3fc;text-decoration:none}
    @media(max-width:620px){.container{grid-template-columns:1fr;gap:13px}.pack-image{height:155px}}
  </style>
</head>
<body>
<header>
  <h1>📦 Mod Pack</h1>
  <p>Các gói Mod Skin • Android - IOS • Chọn gói để tải</p>
</header>
<div class="ad-notice"><div class="ad-notice-inner"><span class="ad-dot"></span><div><span class="ad-label">QUẢNG CÁO</span> Một quảng cáo ngắn sẽ được mở trước khi tải Mod Pack.</div></div></div>
<div class="container" id="list"></div>
<div class="ad-modal" id="adModal" aria-hidden="true">
  <div class="ad-box">
    <div class="ad-icon">📢</div>
    <h2>Đang mở quảng cáo</h2>
    <p>Quảng cáo giúp duy trì website. Vui lòng chờ một chút, sau đó file Mod Pack sẽ được mở.</p>
    <div class="ad-progress"><span id="adProgress"></span></div>
    <div class="ad-count" id="adCount">Đang chuẩn bị…</div>
    <button class="ad-continue" id="adContinue" type="button">Tiếp tục tải Mod Pack</button>
  </div>
</div>
<a class="back" href="index.html">← Quay lại trang chủ</a>
<script>
async function loadPacks(){
  const list=document.getElementById('list');
  try{
    const res=await fetch('data/modpacks.json?v='+Date.now(),{cache:'no-store'});
    const data=await res.json();
    list.innerHTML=data.map(item=>`
      <article class="pack-card">
        <img class="pack-image" src="${escapeHtml(item.image || 'assets/icons/mod.png')}" alt="${escapeHtml(item.name || 'Mod Pack')}">
        <div class="pack-body">
          <h2 class="pack-title">${escapeHtml(item.name || '')}</h2>
          <div class="pack-desc">${escapeHtml(item.desc || '')}</div>
          ${item.tag ? `<span class="pack-tag">${escapeHtml(item.tag)}</span>` : ''}
          <a class="pack-link modpack-download" href="${escapeHtml(item.link || '#')}">⬇ TẢI MOD PACK</a>
        </div>
      </article>
    `).join('');
  }catch(err){
    list.innerHTML='<p style="grid-column:1/-1;text-align:center;color:#98a6ba">Không tải được danh sách Mod Pack.</p>';
    console.error(err);
  }
}
function escapeHtml(value){
  return String(value).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
}
function setupAdGate(){
  const modal=document.getElementById('adModal');
  const progress=document.getElementById('adProgress');
  const count=document.getElementById('adCount');
  const cont=document.getElementById('adContinue');
  let pending='';
  let timer=null;
  let popup=null;

  document.addEventListener('click',function(e){
    const link=e.target.closest('.modpack-download');
    if(!link) return;
    const dest=link.getAttribute('href');
    if(!dest || dest==='#') return;
    e.preventDefault();
    pending=dest;
    modal.classList.add('show');
    modal.setAttribute('aria-hidden','false');
    cont.classList.remove('show');
    progress.style.width='0%';
    count.textContent='Đang mở quảng cáo…';

    // Open one configured ad directly from the user click when possible.
    const ads=Array.isArray(window.TIKTOK_AD_LINKS)?window.TIKTOK_AD_LINKS.filter(u=>/^https?:\/\//i.test(String(u))):[];
    if(ads.length){
      const ad=ads[Math.floor(Math.random()*ads.length)];
      try{ popup=window.open(ad,'_blank','noopener,noreferrer'); }catch(err){ popup=null; }
    }

    const total=1800;
    const started=Date.now();
    clearInterval(timer);
    timer=setInterval(()=>{
      const elapsed=Date.now()-started;
      const pct=Math.min(100,Math.round(elapsed/total*100));
      progress.style.width=pct+'%';
      const left=Math.max(0,Math.ceil((total-elapsed)/1000));
      count.textContent=left>0 ? 'Vui lòng chờ '+left+' giây…' : 'Bạn có thể tiếp tục tải.';
      if(pct>=100){
        clearInterval(timer);
        cont.classList.add('show');
      }
    },100);
  },true);

  cont.addEventListener('click',()=>{
    if(!pending) return;
    const dest=pending;
    pending='';
    modal.classList.remove('show');
    modal.setAttribute('aria-hidden','true');
    window.location.assign(dest);
  });
}

setupAdGate();
loadPacks();
</script>
</body>
</html>
