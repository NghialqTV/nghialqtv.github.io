<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mod Pack | NghĩaLQ TV</title>
<script src="tiktok_ads/config.js"></script>
<script src="tiktok_ads/tiktok-gate.js"></script>
<style>
:root{--bg:#050b18;--panel:#0b1427;--panel2:#101c32;--line:#243657;--text:#f4f7ff;--sub:#91a0ba;--pink:#ff2d86;--purple:#8b45ff;--cyan:#22c7ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#18294d 0,#050b18 48%,#030711 100%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}.top{max-width:1080px;margin:auto;padding:18px 16px 8px;display:flex;align-items:center;gap:14px}.back{width:42px;height:42px;border-radius:13px;border:1px solid var(--line);background:#0d192d;color:#fff;text-decoration:none;display:grid;place-items:center;font-size:25px}.brand{font-size:22px;font-weight:850}.brand small{display:block;color:var(--sub);font-size:12px;font-weight:500;margin-top:2px}.wrap{max-width:1080px;margin:auto;padding:8px 16px 40px}.hero{text-align:center;padding:18px 0 22px}.hero h1{margin:0;font-size:30px;letter-spacing:.3px}.hero h1 span{color:var(--pink)}.hero p{margin:8px 0 0;color:var(--sub);font-size:13px}.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{padding:11px;border:1px solid var(--line);border-radius:19px;background:linear-gradient(145deg,#0e1a2e,#081121);box-shadow:0 12px 28px #0005;transition:.2s}.card:hover{transform:translateY(-2px);border-color:#ff3d92;box-shadow:0 0 24px #ff2d8620}.thumb{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:13px;border:1px solid #30415f;background:#091223}.ct{padding:11px 4px 3px}.ct h2{font-size:17px;margin:0 0 6px}.desc{color:var(--sub);font-size:12px;line-height:1.5}.row{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}.badges{display:flex;gap:6px;flex-wrap:wrap}.badge{font-size:10px;padding:5px 8px;border-radius:999px;background:#13233d;color:#c8d5e8;border:1px solid #263a5b}.download{margin-left:auto;display:inline-flex;padding:9px 14px;border-radius:11px;background:linear-gradient(135deg,#ff267f,#ff4d5e);color:#fff;text-decoration:none;font-size:12px;font-weight:850;box-shadow:0 6px 16px #ff2d8630}.download:hover{filter:brightness(1.08)}
.detail-page{display:none;max-width:760px;margin:0 auto}.detail-page.show{display:block}.detail-card{border:1px solid #263858;border-radius:22px;background:linear-gradient(145deg,#0d172a,#07101f);padding:14px;box-shadow:0 18px 45px #0007}.detail-img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:15px;border:1px solid #334766}.detail h2{font-size:24px;margin:15px 2px 5px}.detail-sub{color:var(--sub);font-size:13px}.specs{margin-top:15px;border:1px solid #1c2b45;border-radius:14px;overflow:hidden}.spec{display:flex;justify-content:space-between;gap:12px;padding:12px;font-size:12px;border-bottom:1px solid #1c2b45}.spec:last-child{border-bottom:0}.spec b{color:#aebbd0}.spec strong{color:#ff64ad}.detail-download{display:block;text-align:center;margin-top:15px;padding:14px;border-radius:12px;background:linear-gradient(135deg,#ff2d86,#ff405e);color:#fff;text-decoration:none;font-weight:850}.back-list{display:inline-flex;margin:0 0 12px;padding:9px 13px;border-radius:10px;border:1px solid var(--line);background:#0d192d;color:#fff;text-decoration:none;font-size:12px}
.empty{padding:30px;text-align:center;color:var(--sub)}@media(max-width:720px){.list{grid-template-columns:1fr}.hero h1{font-size:26px}.row{align-items:stretch}.download{margin-left:auto}}@media(max-width:430px){.download{padding:8px 11px}.ct h2{font-size:16px}}
</style></head><body>
<div class="top"><a class="back" href="index.html" aria-label="Quay lại">‹</a><div class="brand"><span style="color:#ff2d86">▰</span> Mod Pack<small>Tổng hợp các pack mod skin chất lượng cao</small></div></div>
<main class="wrap">
<section class="hero"><h1><span>▰</span> MOD PACK</h1><p>Android - IOS • Full nút bấm • Không trùng • S4 - 2026</p></section>
<section id="list" class="list"></section>
<section id="detailPage" class="detail-page"><a class="back-list" href="mod-pack.html">‹ Quay lại danh sách</a><div id="detail" class="detail-card"></div></section>
</main>
<script>
let packs=[];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function skinCount(name){const m=String(name||'').match(/\d+/);return m?m[0]:'—'}
function platforms(tag){const t=String(tag||'').toUpperCase();return t.includes('ANDROID')&&t.includes('IOS')?'<span class="badge">🤖 Android</span><span class="badge"> IOS</span>':t.includes('ANDROID')?'<span class="badge">🤖 Android</span>':'<span class="badge"> IOS</span>'}
function gate(url){if(window.tiktokAdGate)window.tiktokAdGate(url);else window.location.assign(url)}
function renderList(){
 const box=document.getElementById('list');
 box.innerHTML=packs.map((p,i)=>`<article class="card">
  <img class="thumb" src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy" onerror="this.style.display='none'">
  <div class="ct"><h2>${esc(p.name)}${i===0?' 🔥':''}</h2><div class="desc">${esc(p.desc||'')}<br>S4 - 2026</div>
   <div class="row"><div class="badges">${platforms(p.tag)}</div><a class="download" data-tiktok-gate href="mod-pack.html?pack=${i}">⇩ Tải Ngay</a></div>
  </div></article>`).join('');
}
function renderDetail(i){
 const p=packs[i];if(!p)return;
 document.getElementById('list').style.display='none';
 document.getElementById('detailPage').classList.add('show');
 document.getElementById('detail').innerHTML=`<img class="detail-img" src="${esc(p.image)}" alt="${esc(p.name)}"><div class="detail"><h2>${esc(p.name)}${i===0?' 🔥':''}</h2><div class="detail-sub">${esc(p.desc||'')} • S4 - 2026</div><div class="specs"><div class="spec"><b>▱ Số Skin</b><strong>${esc(skinCount(p.name))} Skin</strong></div><div class="spec"><b>🎮 Nền tảng</b><span>${esc(p.tag||'Android - IOS')}</span></div><div class="spec"><b>▦ Cập Nhật</b><strong>S4 - 2026</strong></div><div class="spec"><b>⚙ Tính năng</b><span>Full nút bấm • Không trùng</span></div></div><a class="detail-download" data-tiktok-gate href="${esc(p.link)}">⇩ Tải Mod Pack ↗</a></div>`;
}
async function init(){
 const r=await fetch('data/modpacks.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('data');packs=await r.json();
 const q=new URLSearchParams(location.search);const n=Number(q.get('pack'));
 if(Number.isInteger(n)&&n>=0&&n<packs.length)renderDetail(n);else renderList();
}
init().catch(()=>document.getElementById('list').innerHTML='<div class="empty">Không tải được danh sách Mod Pack. Hãy kiểm tra data/modpacks.json.</div>');
</script></body></html>
